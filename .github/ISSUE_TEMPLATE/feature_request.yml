name: 功能建议
description: 描述实际使用场景和需要改善的操作
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和问题
      description: 谁在什么情况下遇到了问题，目前怎样处理？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 给出一个具体输入和期望结果，说明哪些平台需要支持。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与验证方式
      description: 已考虑的方法、可提供的样本或设备，以及怎样判断改动有用。
